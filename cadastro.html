<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - PET LOVE </title>
    <link rel="stylesheet" href="estilo.css">    
    
</head>
<body>
    <header>
        <h2>Formulário de Cadastro</h2>
        <nav>
            <ul>
                <li><a href="index.html">INÍCIO</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <main>
        <section>
             <p>Preencha os dados abaixo para Criar seu cadastro e participar do Clube de Assinantes.</p>
            <form>
                <p>
            <div class="cartao">
         
                    <label for="campo-nome">Nome Completo:</label>
                    <input type="text" id="campo-nome">
                </p>
                <p>
                    <label for="campo-cpf">Seu CPF:</label>
                    <input type="text" id="campo-cpf">
                </p>
                <p>
                    <label for="campo-email">Seu E-mail:</label>
                    <input type="email" id="campo-email">
                </p>
                <p>
                    <label for="campo-rua">Seu Endereço — Rua:</label>
                    <input type="text" id="campo-rua">
                </p>
                <p>
                    <label for="campo-cidade">Sua — Cidade:</label>
                    <input type="text" id="campo-cidade">
                </p>
                <p>
                    <label for="campo-estado">Seu — Estado/UF:</label>
                    <input type="text" id="campo-estado">
                </p>
                <p>
                    <label for="campo-pais">Seu — País:</label>
                    <input type="text" id="campo-pais">
                </p>
                <p>
                    <label for="campo-senha">Sua Senha:</label>
                    <input type="password" id="campo-senha">
                </p>
            
            <div class=botao>
                <p>
                    <button type="submit">Concluir Cadastro</button>
                </p>
            </div>
            </form>
        </section>
    </main>
    <hr>
    <footer>
        <p><em><strong>@Todos os direitos reservados: PET SHOP & TAXI PET </strong></em></p>
    </footer>
</body>
</html>
